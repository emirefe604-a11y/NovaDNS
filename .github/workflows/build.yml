name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Repodaki zip dosyasını çıkar
        run: |
          mkdir -p /tmp/src
          Z=$(find . -iname "*.zip" -not -path "./.git/*" | head -1)
          if [ -n "$Z" ]; then
            echo "Zip bulundu: $Z"
            unzip -oq "$Z" -d /tmp/src
          else
            echo "Zip yok, repo içeriği kullanılacak"
            cp -r . /tmp/src
          fi

      - name: Proje klasörünü bul
        id: proj
        run: |
          F=$(find /tmp/src -name settings.gradle.kts | head -1)
          if [ -z "$F" ]; then
            echo "settings.gradle.kts bulunamadı. İçerik:"
            find /tmp/src -not -path "*/.git/*" | head -50
            exit 1
          fi
          D=$(dirname "$F")
          echo "Proje klasörü: $D"
          echo "dir=$D" >> "$GITHUB_OUTPUT"

      - name: APK derle
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK'yı hazırla
        run: |
          APK=$(find /tmp/src -path "*outputs/apk/debug/*.apk" | head -1)
          cp "$APK" NovaDNS.apk
          ls -la NovaDNS.apk

      - name: APK'yı repoya koy (doğrudan indirilebilir)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f NovaDNS.apk
          git commit -m "NovaDNS.apk güncellendi [skip ci]" || echo "Değişiklik yok"
          git push || echo "Push başarısız (izinleri kontrol et)"

      - name: Release olarak yayınla (sabit link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y --repo "${{ github.repository }}" || true
          gh release create latest NovaDNS.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Nova DNS (son sürüm)" \
            --notes "Doğrudan indirilebilir APK" \
            --latest
